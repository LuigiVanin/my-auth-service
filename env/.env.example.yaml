# Server Configuration
# Server Configuration
server:
  port: 8080

# App Configuration
app:
  env: development
  name: AUTH SERVICE
  encryption_key: Should Be Random UUID

# Database Configuration
database:
  host: localhost
  port: 5432
  user: postgres
  password: password
  name: auth_db
  sslmode: disable

email:
  resend_api_key: your_resend_api_key

storage:
  provider: AWS-S3
  public_base_url: https://xxxx.cloudfront.net

  aws:
    s3_bucket_name: vanin-auth-service-storage
    region: us-east-1
    access_key_id: AKIAXXXX
    secret_access_key: xxxx